services:
  - type: web
    name: quantum-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: QUMI_MODEL
        sync: false
